name: CD Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Testes automatizados (Gate de qualidade)
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar analise estatica e formatacao
        run: |
          ruff check .
          ruff format --check .

      - name: Executar testes com pytest
        run: pytest -v

  build-and-push-ecr:
    name: Build Docker e Push para Amazon ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e publicar imagem Docker no ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-ec2:
    name: Deploy automatizado na instancia EC2
    needs: build-and-push-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Executar deploy na instancia EC2
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_URI: ${{ needs.build-and-push-ecr.outputs.image_uri }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ECR_REGISTRY="${IMAGE_URI%%/*}"
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" << EOF
            set -e
            export PATH=\$PATH:/snap/bin

            echo "Autenticando Docker no Amazon ECR usando IAM Role da EC2..."
            aws ecr get-login-password --region ${AWS_REGION} \vert{} docker login --username AWS --password-stdin${ECR_REGISTRY}

            echo "Baixando nova imagem ${IMAGE_URI}..."
            docker pull ${IMAGE_URI}

            echo "Substituindo container anterior..."
            docker stop devops-python-api || true
            docker rm devops-python-api || true

            echo "Iniciando novo container na porta 80..."
            docker run -d \
              --name devops-python-api \
              --restart unless-stopped \
              -p 80:8000 \
              ${IMAGE_URI}

            echo "Verificando status do container e saude da API..."
            sleep 3
            docker ps --filter "name=devops-python-api"
            curl --fail --silent http://127.0.0.1:80/health
            echo ""
            echo "Deploy concluido com sucesso!"
          EOF